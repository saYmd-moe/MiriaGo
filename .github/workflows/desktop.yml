name: Desktop Launcher

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: miriago-desktop-windows
            platform-name: windows-x64
          - os: macos-latest
            artifact-name: miriago-desktop-macos
            platform-name: macos
          - os: ubuntu-22.04
            artifact-name: miriago-desktop-linux
            platform-name: linux-x86_64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget \
            xdg-utils

      - name: Install dependencies
        run: |
          flutter pub get
          npm ci

      - name: Read app version
        shell: bash
        run: |
          version_line="$(grep '^version:' pubspec.yaml | head -n 1)"
          app_version="${version_line#version: }"
          app_version="${app_version%%+*}"
          echo "APP_VERSION=$app_version" >> "$GITHUB_ENV"
          echo "ZIP_NAME=MiriaGo-v$app_version-${{ matrix.platform-name }}.zip" >> "$GITHUB_ENV"

      - name: Analyze Flutter
        run: flutter analyze --no-pub

      - name: Build Flutter Web
        run: bash scripts/build-flutter-web.sh --release --no-pub

      - name: Build Tauri desktop app
        if: runner.os != 'Linux'
        run: npm run desktop:build

      - name: Build Tauri Linux packages
        if: runner.os == 'Linux'
        run: npm run desktop:build -- --bundles appimage,deb

      - name: Package macOS zip
        if: runner.os == 'macOS'
        run: |
          app_path="src-tauri/target/release/bundle/macos/MiriaGo.app"
          package_dir="dist/desktop/MiriaGo-macos"
          if [ ! -d "$app_path" ]; then
            echo "Missing macOS app bundle: $app_path" >&2
            exit 1
          fi

          codesign --force --deep --sign - "$app_path"
          codesign --verify --deep --strict --verbose=4 "$app_path"

          rm -rf dist/desktop
          mkdir -p "$package_dir"
          cp -R "$app_path" "$package_dir/"
          codesign --verify --deep --strict --verbose=4 "$package_dir/MiriaGo.app"
          ditto -c -k --sequesterRsrc --keepParent "$package_dir" "dist/desktop/$ZIP_NAME"

      - name: Package Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exePath = "src-tauri\target\release\miriago-desktop.exe"
          $packageDir = "dist\desktop\MiriaGo-windows"
          if (!(Test-Path $exePath)) {
            throw "Missing Windows executable: $exePath"
          }

          if (Test-Path "dist\desktop") {
            Remove-Item "dist\desktop" -Recurse -Force
          }
          New-Item -ItemType Directory -Path "$packageDir\MiriaGoData" -Force | Out-Null
          Copy-Item $exePath "$packageDir\MiriaGo.exe"
          Compress-Archive -Path $packageDir -DestinationPath "dist\desktop\$env:ZIP_NAME" -Force

      - name: Package Linux artifacts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          shopt -s nullglob
          appimages=(src-tauri/target/release/bundle/appimage/*.AppImage)
          debs=(src-tauri/target/release/bundle/deb/*.deb)
          if [ "${#appimages[@]}" -ne 1 ]; then
            echo "Expected exactly one AppImage, found ${#appimages[@]}" >&2
            printf '  %s\n' "${appimages[@]}" >&2
            exit 1
          fi
          if [ "${#debs[@]}" -ne 1 ]; then
            echo "Expected exactly one deb package, found ${#debs[@]}" >&2
            printf '  %s\n' "${debs[@]}" >&2
            exit 1
          fi

          rm -rf dist/desktop
          mkdir -p dist/desktop
          install -m 755 "${appimages[0]}" \
            "dist/desktop/MiriaGo-v${APP_VERSION}-linux-x86_64.AppImage"
          install -m 644 "${debs[0]}" \
            "dist/desktop/MiriaGo-v${APP_VERSION}-linux-x86_64.deb"

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          if-no-files-found: error
          path: |
            dist/desktop/*.zip
            dist/desktop/*.AppImage
            dist/desktop/*.deb

      - name: Attach desktop artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/desktop/*.zip
            dist/desktop/*.AppImage
            dist/desktop/*.deb
