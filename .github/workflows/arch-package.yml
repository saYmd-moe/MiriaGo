name: Arch Linux Package (M4)

on:
  workflow_dispatch:
  push:
    branches: ['ci/linux-arch-release', 'main']
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: arch-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & verify Arch pacman package
    runs-on: ubuntu-latest
    container:
      # Clean Arch base-devel baseline. This is a rolling image tag rather
      # than an unverified digest; the package/tool versions are recorded in
      # the log and should be pinned deliberately when a digest is verified.
      image: archlinux/archlinux:base-devel
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install base build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git curl \
            file libayatana-appindicator librsvg openssl patchelf \
            webkit2gtk-4.1 wget xdotool xdg-utils \
            nodejs npm fakeroot zstd rust cargo \
            desktop-file-utils gcc glibc \
            xorg-server-xvfb coreutils shellcheck

      - name: Record clean Arch baseline
        shell: bash
        run: |
          pacman -Q base-devel nodejs npm rust cargo webkit2gtk-4.1 gtk3 xdg-desktop-portal-gtk | tee arch-package-baseline.txt

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Check packaging scripts
        shell: bash
        run: ./scripts/test-arch-package.sh

      - name: Read metadata (fail fast on version drift)
        shell: bash
        run: |
          cargo_ver="$(awk -F '"' '/^version = "/ { print $2; exit }' src-tauri/Cargo.toml)"
          pkg_ver="$(awk -F= '/^pkgver=/ { print $2; exit }' packaging/arch/PKGBUILD)"
          pubspec_ver="$(awk -F'[ :]+' '/^version:/ { print $2; exit }' pubspec.yaml)"
          pubspec_ver="${pubspec_ver%%+*}"
          tauri_ver="$(awk -F '"' '/"version"/ { print $4; exit }' src-tauri/tauri.conf.json)"
          echo "cargo=$cargo_ver pkgbuild=$pkg_ver pubspec=$pubspec_ver tauri=$tauri_ver"
          if [[ "$cargo_ver" != "$pkg_ver" || "$cargo_ver" != "$pubspec_ver" || "$cargo_ver" != "$tauri_ver" ]]; then
            echo "::error::Version drift: Cargo=$cargo_ver PKGBUILD=$pkg_ver pubspec=$pubspec_ver tauri=$tauri_ver" >&2
            exit 1
          fi
          echo "APP_VERSION=$cargo_ver" >> "$GITHUB_ENV"

      - name: Build Arch package (reuse scripts/build-arch-package.sh)
        id: build
        shell: bash
        run: |
          ./scripts/build-arch-package.sh
          sha256sum dist/arch/*.pkg.tar.zst
        env:
          MIRIAGO_SIGN: ${{ (secrets.MIRIAGO_GPG_PRIVATE_KEY != '' && secrets.MIRIAGO_GPG_FINGERPRINT != '') && '1' || '0' }}
          MIRIAGO_GPG_PRIVATE_KEY: ${{ secrets.MIRIAGO_GPG_PRIVATE_KEY }}
          MIRIAGO_GPG_FINGERPRINT: ${{ secrets.MIRIAGO_GPG_FINGERPRINT }}

      - name: Verify Arch package (reuse scripts/verify-arch-package.sh)
        shell: bash
        run: |
          pkg="$(find dist/arch -maxdepth 1 -name '*.pkg.tar.zst' ! -name '*.sig' -print -quit)"
          if [[ -z "$pkg" ]]; then
            echo "::error::No .pkg.tar.zst artifact produced" >&2
            exit 1
          fi
          ./scripts/verify-arch-package.sh "$pkg"

      - name: Enforce non-empty artifacts and valid SHA256SUMS
        shell: bash
        run: |
          shopt -s nullglob
          zst=(dist/arch/*.pkg.tar.zst)
          sums=(dist/arch/SHA256SUMS)
          if [[ "${#zst[@]}" -ne 1 || "${#sums[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one .pkg.tar.zst and one SHA256SUMS" >&2
            echo "zst=${zst[*]:-none} sums=${sums[*]:-none}" >&2
            exit 1
          fi
          size="$(stat -c%s "${zst[0]}")"
          if [[ "$size" -eq 0 ]]; then
            echo "::error::package is empty (0 bytes)" >&2
            exit 1
          fi
          (cd dist/arch && sha256sum -c SHA256SUMS)

      - name: Upload Arch package artifact
        uses: actions/upload-artifact@v4
        with:
          name: miriago-arch-x86_64
          if-no-files-found: error
          path: |
            dist/arch/*.pkg.tar.zst
            dist/arch/SHA256SUMS
            dist/arch/*.sig
            arch-package-baseline.txt

      - name: Attach Arch package to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/arch/*.pkg.tar.zst
            dist/arch/SHA256SUMS
            dist/arch/*.sig
